; -----------------------------------------------------------------------------
; qt-build.ini
; Qt5.15.2 Windows x86 (32-bit) 构建配置
; 用法：
;  - 注释以分号 (;) 开头
;  - 每行 key=value 的格式
;  - 支持的 key 列表见下方示范
; -----------------------------------------------------------------------------

; Qt 源码根目录（必须）
QT_SRC=C:\src\qt-everywhere-src-5.15.2

; 构建目录（可选），默认： %QT_SRC%\build_<BUILD_TYPE>
BUILD_DIR=

; 安装目录（configure -prefix），可选
INSTALL_DIR=C:\Qt\5.15.2\msvc2017_32

; Visual Studio vcvarsall.bat 路径（必须）
VS_VCVARS=C:\Program Files (x86)\Microsoft Visual Studio\2017\Community\VC\Auxiliary\Build\vcvarsall.bat

; vcvarsall 的参数（一般为 x86）
VS_ARG=x86

; 常用工具路径（可选，若置空则假定在 PATH 中）
PERL_PATH=C:\Strawberry\perl\bin
PYTHON_PATH=C:\Python37
JOM_PATH=C:\Tools\jom

; OpenSSL 安装目录（如果希望链接系统 OpenSSL，可设置）
OPENSSL_DIR=

; 是否跳过 qtwebengine（1=跳过，0=包含）
; 推荐默认跳过（qtwebengine 需要 depot_tools/Chromium 大量依赖）
SKIP_QTWEBENGINE=1

; 构建类型：shared 或 static （必须，注意 static 会生成静态 Qt 库）
BUILD_TYPE=shared

; 如果 BUILD_TYPE=static，可选择是否静态链接 CRT（/MT）
; 0 = 使用动态 CRT (/MD)；1 = 使用静态运行时 (/MT)
USE_STATIC_RUNTIME=0

; 并行编译任务数（可用 %NUMBER_OF_PROCESSORS% 或具体数字）
MAKE_JOBS=%NUMBER_OF_PROCESSORS%

; 额外 configure 参数（例如 -nomake examples -opensource -confirm-license 已在脚本里）
EXTRA_CONFIG=

; 额外说明：你可以复制多份 ini 来做不同配置（shared 和 static 分别一个）。
; -----------------------------------------------------------------------------