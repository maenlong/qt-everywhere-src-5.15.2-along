; -----------------------------------------------------------------------------
; qt-build.ini
; Qt5.15.2 Windows x86 (32-bit) 构建配置
; 用法：
;  - 注释以分号 (;) 开头
;  - 每行 key=value 的格式
;  - 支持的 key 列表见下方示范
; -----------------------------------------------------------------------------

; Qt 源码根目录（必须）
QT_SRC=..\..\qt-everywhere-src-5.15.2

; 构建目录（可选），默认： %QT_SRC%\build_<BUILD_TYPE>
BUILD_DIR=.\build_<BUILD_TYPE>

; 安装目录（configure -prefix），可选
INSTALL_DIR=.\install_<BUILD_TYPE>

; Visual Studio vcvarsall.bat 路径（必须）
VS_VCVARS=C:\Program Files (x86)\Microsoft Visual Studio\2017\Enterprise\VC\Auxiliary\Build\vcvarsall.bat

; vcvarsall 的参数（一般为 x86）
VS_ARG=x86

; 临时目录（强烈建议配置为纯英文路径，避免中文用户名导致 cl/c1xx 创建中间文件失败）
; 支持绝对路径：D:\qt_temp 或 C:\qt_temp
; 也支持相对路径：.\qt_temp（相对当前 ini 文件所在目录）
SAFE_TEMP_DIR=.\temp_<BUILD_TYPE>

; 常用工具路径（可选，若置空则假定在 PATH 中）
PERL_PATH=C:\strawberry-perl-5.42.0.1-64bit-portable\perl\bin
PYTHON_PATH=%LOCALAPPDATA%\Programs\Python\Python313

; OpenSSL 安装目录（如果希望链接系统 OpenSSL，可设置）
OPENSSL_DIR=C:\Program Files (x86)\OpenSSL-Win32

; 是否跳过 qtwebengine（1=跳过，0=包含）
; 推荐默认跳过（qtwebengine 需要 depot_tools/Chromium 大量依赖）
SKIP_QTWEBENGINE=1

; 构建类型：shared 或 static （必须，注意 static 会生成静态 Qt 库）
BUILD_TYPE=static

; 如果 BUILD_TYPE=static，可选择是否静态链接 CRT（/MT）
; 0 = 使用动态 CRT (/MD)；1 = 使用静态运行时 (/MT)
USE_STATIC_RUNTIME=1

; 并行编译任务数（可用 %NUMBER_OF_PROCESSORS% 或具体数字）
MAKE_JOBS=%NUMBER_OF_PROCESSORS%

; 额外 configure 参数（例如 -nomake examples -opensource -confirm-license 已在脚本里）
EXTRA_CONFIG=

; 额外说明：你可以复制多份 ini 来做不同配置（shared 和 static 分别一个）。
; -----------------------------------------------------------------------------